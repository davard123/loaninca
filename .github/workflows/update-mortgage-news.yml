name: Update mortgage news

on:
  schedule:
    - cron: "30 17 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the latest Freddie Mac PMMS
        run: node scripts/update-mortgage-news.mjs
      - name: Publish changed data
        run: |
          if git diff --quiet -- assets/mortgage-news.json ios/LoanInCACalculator/LoanInCACalculator/mortgage-news.json; then
            echo "No mortgage news changes"
            exit 0
          fi
          git config user.name "loaninca-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/mortgage-news.json ios/LoanInCACalculator/LoanInCACalculator/mortgage-news.json
          git commit -m "chore: refresh weekly mortgage news"
          git push
