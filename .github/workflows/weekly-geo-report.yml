name: Weekly GEO report

# 每周一早上生成「AI 效果报表」，用 Telegram 把 Markdown 文件发给站长。
# 这个仓库是公开的，所以报表不提交进仓库、不写进运行日志、不存成 artifact。
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里加三个 secret：
#   LOANINCA_ADMIN_KEY   网站后台的管理密钥（和 Cloudflare Pages 里的 ADMIN_KEY 同一个值）
#   TELEGRAM_BOT_TOKEN   和 Cloudflare Pages 里的同名变量同一个值
#   TELEGRAM_CHAT_ID     和 Cloudflare Pages 里的同名变量同一个值
# 三个都没配的时候这个任务什么也不做、也不报错。

on:
  schedule:
    # 每周一 16:30 UTC（加州早上 8:30 / 夏令时 9:30）
    - cron: "30 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: weekly-geo-report
      cancel-in-progress: false
    env:
      LOANINCA_ADMIN_KEY: ${{ secrets.LOANINCA_ADMIN_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check secrets
        id: ready
        run: |
          if [ -z "$LOANINCA_ADMIN_KEY" ] || [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets are not configured yet; skipping."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == '1'
        with:
          # 需要完整历史：用每个页面第一次提交的时间当作上线日期
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: "22"
      - name: Build report
        if: steps.ready.outputs.ok == '1'
        run: node scripts/weekly-geo-report.mjs --out "$RUNNER_TEMP/loaninca-geo-weekly.md" > /dev/null
      - name: Send to Telegram
        if: steps.ready.outputs.ok == '1'
        run: |
          curl -sS --fail -o /dev/null \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "caption=loaninca.com 每周 AI 效果报表" \
            -F "document=@$RUNNER_TEMP/loaninca-geo-weekly.md" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
